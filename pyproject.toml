[project]
name = "retrieval"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "faiss-cpu>=1.14.3",
    "huggingface-hub>=1.26.0",
    "matplotlib>=3.10.0",
    "numpy>=2.5.1",
    "pypdf>=6.14.2",
    "pyyaml>=6.0.3",
    "sentence-transformers>=5.6.1",
    "torch>=2.13.0",
    "transformers>=5.14.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["retrieval"]
